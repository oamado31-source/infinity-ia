name: Validate SDD and synthetic tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install synthetic test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Python syntax and synthetic unit suite
        run: |
          python -m compileall -q src tests examples/chronology
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s examples/chronology -p 'test_*.py' -q
      - name: Prevent edits to historical approved ADRs
        if: github.event_name == 'pull_request'
        run: python scripts/check_historical_adrs.py
      - name: Basic protected-file checks
        run: python scripts/check_public_files.py
